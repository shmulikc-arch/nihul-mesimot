<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקד תקלות - התחברות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מוקד תקלות">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/><path d="M10 6v12" stroke-dasharray="2 2"/></svg>
      </div>
      <div class="app-name">מוקד תקלות</div>
      <div class="school-name">בית הספר</div>

      <form id="login-form">
        <div class="field">
          <label class="field-label" for="email">אימייל</label>
          <input id="email" type="email" required autocomplete="username" inputmode="email">
        </div>
        <div class="field">
          <label class="field-label" for="password">סיסמה</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-text" hidden></div>
        <button type="submit" id="login-btn" class="btn-primary">התחברות</button>
      </form>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
