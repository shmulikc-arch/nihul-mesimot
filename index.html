<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול משימות - התחברות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7D2589">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ניהול משימות">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="logo-mark">
        <img src="icons/logo.png" alt="בית חנה">
      </div>
      <div class="app-name">ניהול משימות</div>
      <div class="school-name">בית הספר</div>

      <form id="login-form">
        <div class="field">
          <label class="field-label" for="email">אימייל</label>
          <input id="email" type="email" required autocomplete="username" inputmode="email">
        </div>
        <div class="field">
          <label class="field-label" for="password">סיסמה</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-text" hidden></div>
        <button type="submit" id="login-btn" class="btn-primary">התחברות</button>
      </form>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
