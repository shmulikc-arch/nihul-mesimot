<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקד תקלות - דשבורד מזכירות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1baf7a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { --dept:#1baf7a; --dept-dark:#0f7350; --dept-bg:#e5f6ee; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/><path d="M10 6v12" stroke-dasharray="2 2"/></svg>
    </div>
    <div class="app-name">מוקד תקלות</div>
    <div class="role-pill"></div>
    <div class="spacer"></div>
    <a class="new-btn" href="report.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      דיווח חדש
    </a>
    <div class="user-block">
      <div class="avatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/></svg>
      </div>
      <div>
        <div class="user-name" id="user-name">...</div>
        <div class="user-role" id="user-role-label"></div>
      </div>
    </div>
    <button id="logout-btn" class="logout-btn">התנתקות</button>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div class="body-area" id="ticket-list">
    <div class="empty-state">טוען...</div>
  </div>

  <script type="module" src="js/secretary-entry.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
