<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקד תקלות - דיווח תקלה</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7D2589">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { --dept:#7D2589; --dept-dark:#591b63; --dept-bg:#f3e8f5; }
  .greeting { font-size: 13px; color: var(--ink-2); }
  .greeting b { color: var(--ink); font-weight: 700; }
  .report-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 16px;
  }
  .section-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .recent-title { font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">
      <img src="icons/logo.png" alt="בית חנה">
    </div>
    <div class="app-name">מוקד תקלות</div>
    <div class="spacer"></div>
        <a id="back-link" href="#" hidden class="logout-btn">לדשבורד שלי</a>
    <button id="logout-btn" class="logout-btn">התנתקות</button>
    <button id="logout-btn" class="logout-btn">התנתקות</button>
  </div>

  <div class="body-area centered">
    <div class="greeting">שלום, <b id="user-name">...</b></div>

    <div class="report-card">
      <div class="section-title">דיווח על תקלה חדשה</div>

      <form id="report-form">
        <div class="field">
          <label class="field-label" for="description">תיאור התקלה</label>
          <textarea id="description" required placeholder="לדוגמה: כבל חשמל קרוע ליד השקע במסדרון"></textarea>
        </div>

        <div class="field" style="margin-top:14px">
          <label class="field-label" for="location">מיקום / כיתה (לא חובה)</label>
          <input id="location" type="text" placeholder="לדוגמה: כיתה ד׳2, קומה ב׳">
        </div>

        <div class="field" style="margin-top:14px">
          <span class="field-label">צירוף תמונה (לא חובה)</span>
          <div class="upload-zone" id="upload-zone">
            <div class="icon-chip">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg>
            </div>
            <span>הוספת תמונה מהמצלמה או מהגלריה</span>
          </div>
          <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
          <div id="attachment-preview" hidden class="attachment">
            <img id="attachment-thumb" class="thumb" alt="">
            <div><div class="name" id="attachment-name"></div></div>
            <button type="button" class="remove" id="attachment-remove">הסרה</button>
          </div>
        </div>

        <div class="field" style="margin-top:14px">
          <span class="field-label">לאן לשייך את הדיווח?</span>
          <div class="assign-grid" id="assign-grid">
            <button type="button" class="assign-pill" data-role="facilities">
              <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2-2Z"/></svg></span>
              אב בית
            </button>
            <button type="button" class="assign-pill" data-role="it">
              <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
              מחשוב
            </button>
            <button type="button" class="assign-pill" data-role="secretary">
              <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 10h6M9 14h6"/></svg></span>
              מזכירות
            </button>
          </div>
        </div>

        <div id="form-error" class="error-text" hidden style="margin-top:14px"></div>
<div id="success-box" class="success-msg" hidden style="margin-top:14px">✓ הדיווח נשלח בהצלחה!</div>
        
        <button type="submit" id="submit-btn" class="btn-primary" style="margin-top:16px">
          שליחת דיווח
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z"/></svg>
        </button>
      </form>
    </div>

    <div>
      <div class="recent-title" style="margin-bottom:10px">הדיווחים האחרונים שלי</div>
      <div class="mini-list" id="recent-list">
        <div class="empty-state">טוען...</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/report.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
