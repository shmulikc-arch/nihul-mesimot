<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוקד תקלות - דשבורד ראשי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7D2589">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { --dept:#7D2589; --dept-dark:#591b63; --dept-bg:#f3e8f5; }
  .role-pill { background:#ece9e2; color:var(--ink-2); }
  .main-area { padding: 18px 20px 32px 20px; display: flex; flex-direction: column; gap: 18px; }
  @media (min-width: 720px) { .main-area { padding-left:32px; padding-right:32px; } }
  @media (min-width: 1080px) { .main-area { padding-left:40px; padding-right:40px; max-width:1200px; margin:0 auto; width:100%; } }
</style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">
      <img src="icons/logo.png" alt="בית חנה">
    </div>
    <div class="app-name">מוקד תקלות</div>
    <div class="role-pill">דשבורד ראשי · תמונת מצב כללית</div>
    <div class="spacer"></div>
        <a class="new-btn" href="report.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      דיווח חדש
    </a>
    <div class="user-block">
      <div class="avatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/></svg>
      </div>
      <div>
        <div class="user-name" id="user-name">...</div>
        <div class="user-role">מנהל/ת מערכת</div>
      </div>
    </div>
    <button id="logout-btn" class="logout-btn">התנתקות</button>
  </div>

  <div class="main-area">

    <div class="stat-grid">
      <div class="stat-tile total">
        <div class="stat-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg></div>
        <div><div class="stat-num" id="stat-total">-</div><div class="stat-label">סה״כ תקלות</div></div>
      </div>
      <div class="stat-tile open">
        <div class="stat-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg></div>
        <div><div class="stat-num" id="stat-open">-</div><div class="stat-label">פתוחות</div></div>
      </div>
      <div class="stat-tile prog">
        <div class="stat-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
        <div><div class="stat-num" id="stat-prog">-</div><div class="stat-label">בטיפול</div></div>
      </div>
      <div class="stat-tile done">
        <div class="stat-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></div>
        <div><div class="stat-num" id="stat-done">-</div><div class="stat-label">טופלו</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">התפלגות תקלות לפי גורם אחראי</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-swatch" style="background:var(--st-open)"></span>פתוח</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--st-prog)"></span>בטיפול</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--st-done)"></span>טופל</div>
      </div>
      <div id="chart-rows"></div>
    </div>

    <div class="panel">
      <div class="filters">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="חיפוש לפי תיאור...">
        </div>
        <select id="dept-filter" class="filter-select">
          <option value="all">מחלקה: הכל</option>
          <option value="facilities">אב בית</option>
          <option value="it">מחשוב</option>
          <option value="secretary">מזכירות</option>
        </select>
        <select id="status-filter" class="filter-select">
          <option value="all">סטטוס: הכל</option>
          <option value="open">פתוח</option>
          <option value="in_progress">בטיפול</option>
          <option value="handled">טופל</option>
        </select>
        <div class="spacer"></div>
        <div class="result-count" id="result-count"></div>
      </div>
    </div>

    <div class="panel">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>תיאור</th>
              <th>גורם אחראי</th>
              <th>דווח ע״י</th>
              <th>תאריך</th>
              <th>סטטוס</th>
            </tr>
          </thead>
          <tbody id="tickets-tbody">
            <tr><td colspan="5" class="meta-muted">טוען...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
